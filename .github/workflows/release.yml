name: Release

# Запускається автоматично коли ти пушиш тег виду v1.2.3
on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Відновлюємо секретні файли з GitHub Secrets
      # (самі файли не зберігаються в репозиторії)
      - name: Restore AppSecrets.cs
        shell: pwsh
        run: |
          $bytes = [System.Convert]::FromBase64String("${{ secrets.APPSECRETS_CS }}")
          [System.IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\Infrastructure\AppSecrets.cs", $bytes)

      - name: Inject Google credentials into AppSecrets.cs
        shell: pwsh
        run: |
          $json = '${{ secrets.GOOGLE_CREDENTIALS_JSON }}'
          $escapedJson = $json -replace '"', '""'
          $path = "$env:GITHUB_WORKSPACE\Infrastructure\AppSecrets.cs"
          $content = Get-Content $path -Raw
          $content = $content -replace 'internal const string GoogleServiceAccountJson = "";', "internal const string GoogleServiceAccountJson = @`"$escapedJson`";"
          Set-Content $path $content -Encoding utf8NoBOM

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish Replixer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc "installer\setup.iss"

      # Визначаємо версію із назви тега (v1.2.3 → 1.2.3)
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      # Генеруємо manifest.json: SHA256 для кожного Replixer.* файлу в publish/
      - name: Generate update manifest
        shell: pwsh
        run: |
          $version  = "${{ steps.version.outputs.VERSION }}"
          $baseUrl  = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $files    = Get-ChildItem -Path publish -File |
                        Where-Object { $_.Name -match '^Replixer\.' -and $_.Extension -ne '.pdb' } |
                        ForEach-Object {
                          [ordered]@{
                            path   = $_.Name
                            sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
                            url    = "$baseUrl/$($_.Name)"
                          }
                        }
          [ordered]@{ version = $version; files = @($files) } |
            ConvertTo-Json -Depth 3 |
            Out-File -FilePath manifest.json -Encoding utf8NoBOM

      # Створюємо GitHub Release: інсталер + manifest.json + окремі Replixer.* файли
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Replixer v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            installer/Replixer-Setup.exe
            manifest.json
            publish/Replixer.exe
            publish/Replixer.dll
            publish/Replixer.runtimeconfig.json
            publish/Replixer.deps.json
          body: |
            ## Що нового у версії ${{ steps.version.outputs.VERSION }}

            <!-- Опиши зміни тут перед тим як пушити тег, або відредагуй реліз вручну на GitHub -->

            ---
            **Для клієнтів:** програма запропонує оновлення автоматично при наступному запуску.
