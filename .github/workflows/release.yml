name: Release

# Запускається автоматично коли ти пушиш тег виду v1.2.3
on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Відновлюємо секретні файли з GitHub Secrets
      # (самі файли не зберігаються в репозиторії)
      - name: Restore AppSecrets.cs
        shell: pwsh
        run: |
          $bytes = [System.Convert]::FromBase64String("${{ secrets.APPSECRETS_CS }}")
          [System.IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\Infrastructure\AppSecrets.cs", $bytes)

      - name: Inject Google credentials into AppSecrets.cs
        shell: pwsh
        run: |
          $json = '${{ secrets.GOOGLE_CREDENTIALS_JSON }}'
          $escapedJson = $json -replace '"', '""'
          $path = "$env:GITHUB_WORKSPACE\Infrastructure\AppSecrets.cs"
          $content = Get-Content $path -Raw
          $content = $content -replace 'internal const string GoogleServiceAccountJson = "";', "internal const string GoogleServiceAccountJson = @`"$escapedJson`";"
          Set-Content $path $content -Encoding utf8NoBOM

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish Replixer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc "installer\setup.iss"

      # Визначаємо версію із назви тега (v1.2.3 → 1.2.3)
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      # Тягнемо version.json, який минулий реліз закомітив у main — щоб порівняти
      # SHA256 і не заливати повторно файли рантайму/NuGet, які не змінились.
      # Якщо це перший реліз (файла ще нема в main) — просто працюємо з порожнім списком.
      - name: Fetch previous manifest
        shell: pwsh
        run: |
          git fetch origin main
          $prev = git show origin/main:version.json 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) {
            $prev | Out-File -FilePath previous-version.json -Encoding utf8
            Write-Host "Previous manifest знайдено."
          } else {
            New-Item -ItemType File -Path previous-version.json -Force | Out-Null
            Write-Host "Попереднього manifest'а нема (перший реліз?) — усі файли вважаються новими."
          }

      # Генеруємо manifest.json і version.json: SHA256 для кожного файлу в publish/
      # (усі DLL/EXE/JSON, не тільки Replixer.* — інакше нові NuGet-залежності
      # ніколи не докачаються існуючим користувачам через автооновлення).
      # Але в GitHub Release заливаємо (files: у наступному кроці) лише ті файли,
      # чий SHA256 відрізняється від минулого релізу — решта посилань у manifest.json
      # просто вказує на той старий реліз, де файл з'явився. Це різко скорочує кількість
      # asset-ів на реліз (self-contained публікація — це 200+ файлів рантайму, які
      # майже завжди однакові від релізу до релізу) і уникає secondary rate limit GitHub.
      - name: Generate update manifest
        id: manifest
        shell: pwsh
        run: |
          $version  = "${{ steps.version.outputs.VERSION }}"
          $baseUrl  = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          $prevByName = @{}
          if ((Get-Item previous-version.json).Length -gt 0) {
            $prevJson = Get-Content previous-version.json -Raw | ConvertFrom-Json
            foreach ($f in $prevJson.files) { $prevByName[$f.path] = $f }
          }

          $changedFiles = New-Object System.Collections.Generic.List[string]
          $files = Get-ChildItem -Path publish -File |
                     Where-Object { $_.Extension -ne '.pdb' } |
                     ForEach-Object {
                       $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
                       $prev = $prevByName[$_.Name]
                       if ($prev -and $prev.sha256 -eq $hash) {
                         # Не змінився — не заливаємо повторно, посилання лишається на старий реліз.
                         [ordered]@{ path = $_.Name; sha256 = $hash; url = $prev.url }
                       } else {
                         $changedFiles.Add("publish/$($_.Name)")
                         [ordered]@{ path = $_.Name; sha256 = $hash; url = "$baseUrl/$($_.Name)" }
                       }
                     }

          $manifest = [ordered]@{ version = $version; files = @($files) }
          $manifest | ConvertTo-Json -Depth 3 | Out-File -FilePath manifest.json  -Encoding utf8NoBOM
          $manifest | ConvertTo-Json -Depth 3 | Out-File -FilePath version.json   -Encoding utf8NoBOM

          Write-Host "Змінених файлів для заливки: $($changedFiles.Count) / $($files.Count)"

          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "changed_files<<$delimiter"
          if ($changedFiles.Count -gt 0) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value ($changedFiles -join "`n")
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter

      # Комітимо version.json у main щоб застосунок міг читати його без API
      - name: Commit version.json to main
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Робоча директорія зараз у detached HEAD (checkout тегу), і version.json
          # у ній вже перезаписаний кроком "Generate update manifest" — це незакомічена
          # зміна. Якщо просто зробити checkout main, git відмовиться перемикати гілку,
          # щоб не затерти цю зміну. Тому зберігаємо новий version.json окремо,
          # форсовано перемикаємось на main (відкидаючи "брудний" detached HEAD,
          # він нам більше не потрібен), і повертаємо новий вміст назад.
          Copy-Item version.json "$env:RUNNER_TEMP\version.json" -Force

          git fetch origin main
          git checkout -f main

          Copy-Item "$env:RUNNER_TEMP\version.json" version.json -Force

          git add version.json
          git commit -m "chore: update version.json to ${{ steps.version.outputs.VERSION }}"
          git push origin main

      # Створюємо GitHub Release: інсталер + manifest.json + лише ЗМІНЕНІ файли з publish/
      # (список — вихід кроку "Generate update manifest"; незмінені файли рантайму/NuGet
      # не заливаються повторно, щоб не впертись у secondary rate limit GitHub)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Replixer v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            installer/Replixer-Setup.exe
            manifest.json
            ${{ steps.manifest.outputs.changed_files }}
          body: |
            ## Що нового у версії ${{ steps.version.outputs.VERSION }}

            <!-- Опиши зміни тут перед тим як пушити тег, або відредагуй реліз вручну на GitHub -->

            ---
            **Для клієнтів:** програма запропонує оновлення автоматично при наступному запуску.
